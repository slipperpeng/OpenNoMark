name: Offline Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-offline-v*"

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - run: uv sync --frozen --extra api --extra desktop
      - run: npm ci --prefix frontend
      - run: npm ci --prefix desktop
      - run: npm --prefix desktop test
      - run: npm --prefix desktop run dist:win:offline

      - uses: actions/upload-artifact@v4
        with:
          name: opennomark-windows-offline
          path: |
            desktop/release/OpenNoMark-Offline-*.exe
            desktop/release/OpenNoMark-Offline-*.exe.blockmap
          compression-level: 0
          if-no-files-found: error
